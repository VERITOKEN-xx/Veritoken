name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Frontend: lint, type-check, and test (issues #386 and #388)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend – lint / type-check / tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Provide stub env values so Vite doesn't abort on missing variables
      - name: Write stub .env
        run: |
          cat > .env <<'EOF'
          VITE_KYC_REGISTRY_ID=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_COMPLIANCE_ENGINE_ID=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_INVOICE_TOKEN_ID=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_PROPERTY_TOKEN_ID=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          VITE_CARBON_TOKEN_ID=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          EOF

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests (unit + integration)
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # Rust contracts: fmt, clippy, and WASM build
  # ────────────────────────────────────────────────────────────────────────────
  contracts:
    name: Contracts – fmt / clippy / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build contracts (release WASM)
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Run contract tests
        run: cargo test --features testutils
